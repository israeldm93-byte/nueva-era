name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc
      - name: Pruebas
        run: npm test
      - name: Montar la web
        run: node tools/construir.mjs "$RUNNER_TEMP/sitio"
