name: Vida

# Cada hora el mundo avanza hasta el momento real (año y medio simulado por hora),
# se guarda en la rama `estado` y se publica la web en GitHub Pages. La web
# lleva el mismo motor empaquetado y sigue simulando en directo en el navegador.
# GitHub puede retrasar los cron; no pasa nada: cada ejecución recupera el
# tiempo que haya pasado desde la anterior.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "tools/**"
      - "package-lock.json"
      - ".github/workflows/vida.yml"

concurrency:
  group: vida
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  vivir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recuperar el mundo
        id: recuperar
        run: |
          mkdir -p estado
          set +e
          git ls-remote --exit-code --heads origin estado > /dev/null
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            git fetch --depth=1 origin estado
            git show FETCH_HEAD:mundo.json > estado/mundo.json
            echo "Mundo recuperado ($(du -h estado/mundo.json | cut -f1))."
            echo "opciones=" >> "$GITHUB_OUTPUT"
          elif [ "$codigo" -eq 2 ]; then
            echo "No hay mundo todavía: nacerá uno nuevo."
            echo "opciones=--crear --prologo 3" >> "$GITHUB_OUTPUT"
          else
            echo "No se pudo consultar la rama estado." >&2
            exit 1
          fi

      - name: Avanzar hasta ahora
        run: node src/cli.ts avanzar --estado estado/mundo.json --web sitio/datos --segundos 600 ${{ steps.recuperar.outputs.opciones }}

      - name: Guardar el mundo en la rama estado
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          dir=$(mktemp -d)
          cp estado/mundo.json "$dir/"
          if [ -f estado/anterior.json ]; then cp estado/anterior.json "$dir/"; fi
          cd "$dir"
          git init -q -b estado
          git config user.name "nueva-era"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "$(node -e 'const m=require("./mundo.json");console.log(`Era ${m.era}, día ${m.t}: ${m.personas.length} personas`)')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" estado

      - name: Montar la web (motor para el navegador y Three.js)
        run: node tools/construir.mjs sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
