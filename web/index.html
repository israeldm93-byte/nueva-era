  <template id="t-como">
    <div class="prosa">
      <p>Un mundo pequeño que vive solo, día y noche. Empezó con una banda de unas quince personas sin palabras, sin fuego y sin herramientas. Nadie les dice qué hacer. El mundo avanza <strong>un año cada hora</strong> (un día cada 30 segundos) y lo que ves está pasando ahora: tu navegador simula el mismo mundo que el servidor, paso a paso, y llega exactamente al mismo resultado.</p>

      <h3>Cada aldeano tiene su propia mente</h3>
      <p>Cada persona piensa con una <strong>red neuronal</strong> pequeña (18 entradas, 6 neuronas ocultas y 12 salidas). Mira cómo está (hambre, salud, edad), cómo está su aldea (comida, leña, materiales, obras, peligro), la estación y lo que ha decidido el consejo, y con eso elige en qué trabajar.</p>
      <ul>
        <li><strong>Aprenden en vida.</strong> Cada noche comparan lo que esperaban de su trabajo con lo que de verdad aportó (frente a la media de su aldea) y corrigen su error en esa situación. Lo que ya prevén bien deja de cambiar; si el mundo cambia, vuelven a aprender.</li>
        <li><strong>Lo heredan.</strong> Cada hijo nace con la mente del padre o la madre al que mejor le ha ido, con alguna mutación. Las familias que deciden mejor prosperan.</li>
        <li><strong>Se mide si aprenden.</strong> Cada mañana su mente prevé si el trabajo que eligen les rendirá más o menos que a la media de su aldea; en «Gráficas» se ve qué parte de los días aciertan (a ciegas sería la mitad). Solo saben reaccionar a lo que han vivido.</li>
      </ul>

      <h3>El consejo, las opiniones y las facciones</h3>
      <p>Cada adulto se forma una opinión sobre qué debería ser lo prioritario (comida, prepararse para el invierno, construir, aprender, buscar tierras nuevas o defenderse) y la contagia al hablar con los demás. Cada noche se reúnen junto al fuego los más respetados (por edad, saber, descubrimientos e hijos) y votan. Lo que deciden empuja las mentes de todos al día siguiente, pero cada cual obedece a su manera.</p>
      <p>Cuando mucha gente piensa distinto que el consejo, se organiza una <strong>facción</strong>. Si el consejo la ignora demasiado tiempo, la facción se marcha con sus familias y funda su propia aldea.</p>

      <h3>Un mundo grande, variado y peligroso</h3>
      <p>Un continente con bosques, praderas, estepas, desiertos, pantanos y cordilleras nevadas, ríos que bajan al mar y <strong>grandes lagos con islas</strong>. En las islas están las mejores vetas (sobre todo el estaño, sin el que no hay bronce), mucha pesca y colonias de aves, pero solo se llega en <strong>canoa</strong>: quien la descubre puede ir a por ellas o irse a vivir allí, lejos de las fieras.</p>
      <ul>
        <li><strong>Lobos.</strong> Viven en manadas y cazan por su cuenta. En los inviernos de hambre rondan las aldeas, entran en los corrales y a veces se llevan a alguien. El fuego, las empalizadas, los vigías y las lanzas los frenan, y los cazadores salen en batida.</li>
        <li><strong>Osos.</strong> Peligrosos para quien trabaja en el bosque. Duermen en invierno. Abatir uno da carne para semanas y una piel enorme.</li>
        <li><strong>Incendios.</strong> En los veranos secos un rayo (o un descuido) prende el bosque; el fuego se extiende, arrasa casas y deja cenizas que tardan años en reverdecer.</li>
        <li><strong>Crecidas.</strong> En las primaveras muy lluviosas los ríos se desbordan y se llevan campos y chozas, aunque dejan limo fértil.</li>
      </ul>

      <h3>Fauna y flora</h3>
      <p>Cada sitio tiene sus plantas: abetos en el norte y en las alturas, robles, abedules y pinos en lo templado, sauces y álamos junto al agua, palmeras en las playas cálidas y cactus en el desierto; y, de cerca, hierba, flores, helechos, setas, juncos y nenúfares. Cambian con las estaciones y se mecen con el viento.</p>
      <p>Donde hay caza viven <strong>rebaños</strong> de ciervos, jabalíes, liebres, caballos salvajes y cabras monteses que pastan y <strong>huyen</strong> de la gente y de las fieras (si se caza demasiado, desaparecen). Los lobos aúllan de noche y el oso se yergue al atacar. Hay patos y garzas en los lagos, gaviotas sobre las islas, águilas sobre las cumbres y perros que acompañan a su dueño. En otoño caen las hojas y en el norte nieva en invierno.</p>
      <p>Al caer la tarde la gente vuelve a casa con lo que ha conseguido: troncos al hombro, la caza a cuestas, sartas de peces, cestos llenos o gavillas de trigo. Los mayores andan con bastón.</p>

      <h3>Vecinos, amigos y enemigos</h3>
      <p>Entre aldeas crecen la amistad (bodas, comercio, un origen común) o el rencor (competir por las mismas tierras, ataques). El hambre, el rencor y la agresividad de quienes mandan pueden llevar a <strong>asaltar</strong> al vecino. Los atacados aprenden a vigilar, levantan empalizadas y pueden aliarse con otros.</p>
      <p>El <strong>consejo declara la guerra</strong> a un vecino concreto (por hambre, codicia, rencor o venganza) y firma la paz cuando le conviene. En guerra encauza las ideas hacia las armas: <strong>arcos, escudos, flechas de fuego, espadas, murallas de piedra y catapultas</strong>, que se descubren probando y se ven en el mundo.</p>

      <h3>Saber, idioma y genes</h3>
      <ul>
        <li><strong>Prueba y error.</strong> Quien tiene curiosidad y tiempo junta cosas que conoce con un gesto (golpear, frotar, atar, calentar…). Nadie sabe qué combinaciones funcionan, pero el trabajo inspira: cortando leña o recogiendo semillas a alguien se le ocurre a medias algo que luego hay que probar. Así se descubren el fuego, la agricultura o el bronce.</li>
        <li><strong>Cultura.</strong> El saber pasa de unos a otros hablando. Si muere la última persona que sabía algo sin haberlo enseñado, se pierde (salvo que esté escrito en tablillas).</li>
        <li><strong>Su propio idioma.</strong> Cuando alguien quiere nombrar algo y no tiene palabra, se la inventa. Las aldeas que se separan acaban hablando lenguas distintas.</li>
        <li><strong>Evolución.</strong> Curiosidad, sociabilidad, fuerza, agresividad… se heredan con pequeñas mutaciones.</li>
      </ul>

      <h3>Lo que no está escrito</h3>
      <p>El orden de los descubrimientos, quién manda, qué facciones nacen, quién ataca a quién, qué se olvida o si la especie se extingue: nada está programado. Si se extingue, el mundo vuelve a empezar en una nueva era. No hay ningún modelo de lenguaje dentro: todo son reglas sencillas y mentes pequeñas que aprenden. La página no desvela lo que aún no han descubierto.</p>

      <h3>Cómo moverse</h3>
      <p>Arrastra para desplazarte, pellizca o usa la rueda para acercarte y gira con dos dedos (o, con ratón, pulsando la rueda o con el botón derecho). El minimapa de la esquina muestra todo el mundo, las fieras que acechan y los incendios: tócalo para ir allí. Toca a cualquiera para ver qué piensa y qué hay en su cabeza, o toca el nombre de una aldea para ver su consejo, sus facciones y sus vecinos.</p>

      <p class="nota">Código abierto en <a href="https://github.com/israeldm93-byte/nueva-era">github.com/israeldm93-byte/nueva-era</a>.</p>
